<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Christian Dating Survey — BEHOLD</title>
    <meta
      name="description"
      content="A short, anonymous research survey about Christian dating apps for Nigerians: what holds people back, and what would make them try one."
    />
    <meta name="theme-color" content="#FBF7F1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/css/styles.css?v={{ASSET_VERSION}}" />
  </head>
  <body class="survey-body">
    <a class="skip-link" href="#main">Skip to the survey</a>

    <header class="site-header">
      <div class="site-header-inner">
        <a class="brand" href="/" aria-label="BEHOLD survey home">
          <span class="brand-mark" aria-hidden="true">B</span>
          <span class="brand-text">
            <span class="brand-name">BEHOLD</span>
            <span class="brand-sub">Christian dating research</span>
          </span>
        </a>
        <div class="header-meta">
          <span class="pill pill-quiet">
            <span class="pill-dot" aria-hidden="true"></span>
            Anonymous study
          </span>
          <span class="header-year">2026</span>
        </div>
      </div>
    </header>

    <main id="main" class="shell" tabindex="-1">
      <div id="app">
        <noscript>
          <div class="panel fallback">
            <h1>JavaScript is required</h1>
            <p>
              This survey needs JavaScript enabled so it can branch to the right
              questions. Please enable it and reload the page.
            </p>
          </div>
        </noscript>
      </div>
    </main>

    <footer class="site-footer">
      <div class="site-footer-inner">
        <p class="footer-note">
          This survey is independent product research. It is not a dating service
          and does not create profiles.
        </p>
        <p class="footer-meta">
          <span>BEHOLD Research · 2026</span>
          <span class="footer-sep" aria-hidden="true">·</span>
          <a href="/admin">Researcher access</a>
        </p>
      </div>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="/js/brand.js?v={{ASSET_VERSION}}"></script>
    <script src="/js/questions.js?v={{ASSET_VERSION}}"></script>
    <script src="/js/survey.js?v={{ASSET_VERSION}}"></script>
  </body>
</html>
